[build-system]
requires = ["flit_core >=4.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "wagtail-polymath"
authors = [{name = "James Ramm", email = "jamessramm@gmail.com"}]
maintainers = [{name = "Wagtail Nest team", email = "hello@wagtail.org"}]
description = "Wagtail StreamField block for rendering mathematical equations"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "Django>=5.2",
    "Wagtail>=7.0"
]
[project.optional-dependencies]
linting = ["prek>=0.5.3,<0.6",]
testing = [
    "dj-database-url==3.1.2",
    "coverage>=7.16.1,<8"
]
coverage = ["coverage>=7.16.1,<8"]
ci = [
    "tox>=4.55.1,<5",
    "tox-gh-actions>=3.5,<4",
]

[project.urls]
Home = "https://github.com/wagtail-nest/wagtail-polymath"
Changelog = "https://github.com/wagtail-nest/wagtail-polymath/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wagtail-nest/wagtail-polymath/blob/main/docs/"

[tool.flit.module]
name = "wagtail_polymath"

[tool.flit.sdist]
exclude = [
    "docs",
    "tests",
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
    "ruff.toml",
    "Makefile",
]
